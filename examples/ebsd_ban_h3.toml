schema_version = 1

# UNCALIBRATED CAMPAIGN TEMPLATE — do not interpret as physical EBSD fracture.
# Measured `ban` ROI driven through the chain-distance field, with ell/h_K ~ 3.
# The terminal displacement reaches 3.73% nominal strain and b=1.5 um saturates
# most of the ROI; redesign the specimen/parameters before running this case.

[geometry]
length = 0.09639
height = 0.048195
nx = 272
ny = 136
precrack_length = 0.0240975

[material]
# Consistent mm-MPa-N units: E [MPa], Gc [N/mm], ell [mm].
young_modulus = 210000.0
poisson_ratio = 0.30
fracture_toughness = 2.7
length_scale = 0.0015
residual_stiffness = 1.0e-8

[loading]
maximum_displacement = 0.0018
steps = 18
stagger_max_iterations = 120
stagger_tolerance = 1.0e-5
damage_kkt_tolerance = 1.0e-6
adaptive = true
maximum_subdivisions = 6
minimum_increment = 1.0e-8

[hydrogen]
enabled = false

[graph]
enabled = true
influence_radius = 0.0015
crack_threshold = 0.70
chain_artifact = "../data/ebsd_gb_chains/ban_roi.npz"
confidence_floor = 0.0

[solver]
linear_ksp_type = "preonly"
linear_pc_type = "lu"
factor_solver = "mumps"
damage_snes_type = "vinewtonrsls"

[output]
directory = "../results/ebsd_ban_h3"
write_every = 2
